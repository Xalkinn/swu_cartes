<!DOCTYPE html><html lang="fr" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${deck.nom + ' — Deck de ' + deck.joueur.pseudo}"></title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/vitrine.css(v=1)}"></head><body><header th:replace="~{fragments/header :: header('joueurs')}"></header>
<main class="vitrine-page"><a class="vitrine-retour" th:href="@{/joueurs/{id}(id=${deck.joueur.id},rubrique='decks')}" th:text="${'← Les decks de ' + deck.joueur.pseudo}"></a><div class="vitrine-entete"><div><p class="eyebrow" th:text="${'DECK PARTAGÉ PAR ' + deck.joueur.pseudo}"></p><h1 th:text="${deck.nom}"></h1><p class="vitrine-notes" th:text="${deck.description}"></p></div><span class="vitrine-etat">Lecture seule</span></div>
<section th:if="${deck.leader != null or deck.base != null}"><h2>Leader &amp; base</h2><div class="vitrine-cartes"><th:block th:if="${deck.leader != null}"><th:block th:replace="~{vitrine/fragments :: carte(${deck.leader.titre},${deck.leader.sousTitre},${deck.leader.reference},${deck.leader.image},1)}"></th:block></th:block><th:block th:if="${deck.base != null}"><th:block th:replace="~{vitrine/fragments :: carte(${deck.base.titre},${deck.base.sousTitre},${deck.base.reference},${deck.base.image},1)}"></th:block></th:block></div></section>
<section><div class="vitrine-section-entete"><h2>Liste principale</h2><span th:text="${deck.total + ' exemplaire(s)'}"></span></div><p class="vitrine-vide" th:if="${deck.lignes.empty}">La liste principale est encore vide.</p><div class="vitrine-cartes"><th:block th:each="ligne : ${deck.lignes}"><th:block th:replace="~{vitrine/fragments :: carte(${ligne.carte.titre},${ligne.carte.sousTitre},${ligne.carte.reference},${ligne.carte.image},${ligne.quantite})}"></th:block></th:block></div></section>
<section th:if="${!deck.reserve.empty}"><h2>Réserve</h2><div class="vitrine-cartes"><th:block th:each="ligne : ${deck.reserve}"><th:block th:replace="~{vitrine/fragments :: carte(${ligne.carte.titre},${ligne.carte.sousTitre},${ligne.carte.reference},${ligne.carte.image},${ligne.quantite})}"></th:block></th:block></div></section>
</main><footer th:replace="~{fragments/footer :: footer}"></footer></body></html>
