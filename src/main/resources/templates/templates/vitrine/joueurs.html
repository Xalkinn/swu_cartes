<!DOCTYPE html><html lang="fr" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Les joueurs — Gestion SWU</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/vitrine.css(v=1)}"></head><body><header th:replace="~{fragments/header :: header('joueurs')}"></header>
<main class="vitrine-page"><div class="vitrine-entete"><div><p class="eyebrow">LA COMMUNAUTÉ</p><h1>Les <span>joueurs.</span></h1><p>Découvrez les collections, les classeurs, les decks et les recherches partagés par les joueurs.</p></div><a th:if="${connecte}" class="vitrine-lien" th:href="@{/ma-vitrine}">Gérer ma vitrine →</a></div>
<form class="vitrine-recherche" th:action="@{/joueurs}" method="get"><label for="q">Trouver un joueur</label><div><input type="search" id="q" name="q" th:value="${q}" maxlength="100" placeholder="Son pseudo…"><button class="vitrine-bouton" type="submit">Rechercher</button></div></form>
<p class="vitrine-notice" th:if="${erreur}" th:text="${erreur}" role="alert"></p><p class="vitrine-texte" th:text="${resultat.totalElements + ' vitrine(s) publique(s)'}"></p>
<p th:if="${resultat.empty}" class="vitrine-vide">Aucune vitrine publique ne correspond à cette recherche.</p>
<div class="vitrine-joueurs"><a class="vitrine-joueur" th:each="joueur : ${resultat.content}" th:href="@{/joueurs/{id}(id=${joueur.id})}"><span class="vitrine-avatar" aria-hidden="true" th:text="${#strings.toUpperCase(#strings.substring(joueur.pseudo,0,1))}"></span><h2 th:text="${joueur.pseudo}"></h2><div class="vitrine-badges"><span th:if="${joueur.collection}">Collection</span><span th:if="${joueur.classeur}">Classeur</span><span th:if="${joueur.decks}">Decks</span><span th:if="${joueur.recherches}">Recherches</span></div><span class="vitrine-joueur-lien">Visiter la vitrine →</span></a></div>
<nav class="vitrine-pagination" th:if="${resultat.totalPages > 1}" aria-label="Pagination des joueurs"><a th:if="${resultat.hasPrevious()}" th:href="@{/joueurs(q=${q},page=${resultat.number - 1})}">← Précédent</a><span th:text="${'Page ' + (resultat.number + 1) + ' sur ' + resultat.totalPages}"></span><a th:if="${resultat.hasNext()}" th:href="@{/joueurs(q=${q},page=${resultat.number + 1})}">Suivant →</a></nav>
</main><footer th:replace="~{fragments/footer :: footer}"></footer></body></html>
